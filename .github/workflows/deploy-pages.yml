name: Deploy Masarat website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: masarat-contracting/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: masarat-contracting
        run: pnpm install --frozen-lockfile
      - name: Build static site
        working-directory: masarat-contracting
        run: pnpm run build:pages
        env:
          GITHUB_ACTIONS: true
      - name: Add Google verification file
        run: cp google6ea5817f81a54832.html masarat-contracting/dist/public/google6ea5817f81a54832.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: masarat-contracting/dist/public

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
